name: Update Profile Cards

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-cards.yml"
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: "username=SarveshThiru&show_icons=true&title_color=FF6B35&icon_color=FFB627&text_color=E6EDF3&bg_color=0D1117&border_color=FF6B35"
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: "username=SarveshThiru&layout=compact&title_color=FF6B35&text_color=E6EDF3&bg_color=0D1117&border_color=FF6B35"
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: "user=SarveshThiru&background=0D1117&stroke=FF6B35&ring=FF6B35&fire=FFB627&currStreakLabel=E6EDF3&sideLabels=E6EDF3&dates=8B949E&border=FF6B35&hide_border=false"
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate trophy
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: SarveshThiru
          output_path: profile/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update profile cards" || exit 0
          git push
